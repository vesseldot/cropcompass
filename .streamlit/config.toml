[theme]
# Tema base claro y global (lo comparten todos los usuarios del servidor, así que la app NO lo cambia).
# El modo oscuro es por sesión: CSS en app/estilos.css bajo body:has(.modo-oscuro). Los tokens viven ahí.
base = "light"
# Color de selección de los controles (sliders, radios, pestañas): --forest-700. El naranja de acción
# (--action-orange) solo lo lleva el botón Analyze vía app/estilos.css. En modo oscuro el CSS lo aclara (#8FC79A).
primaryColor = "#2F4A32"

[server]
# sirve app/static/ en <url>/app/static/ (estilo del mapa satelital, ver app/mapa.py)
enableStaticServing = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
